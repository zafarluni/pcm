    <title>Legacy Pac-Man</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #07091C;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            /* Subtle radial gradient background */
            background-image: radial-gradient(ellipse at center, #0D1035 0%, #07091C 60%, #030308 100%);
        }

        #game-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        canvas {
            display: block;
            /* No pixel-art rendering — allow browser anti-aliasing for smooth circles */
            image-rendering: auto;
            /* Subtle outer glow on the canvas */
            filter: drop-shadow(0 0 20px rgba(43, 91, 255, 0.4)) drop-shadow(0 0 40px rgba(43, 91, 255, 0.15));
        }

        /* ── CRT scanline + vignette overlay ──────────────────────────
           Sits on top of the canvas, pointer-events: none so it never
           intercepts clicks/touches. Opacity kept low (12%) so it
           adds texture without muddying colours.                       */
        #crt-overlay {
            position        : absolute;
            inset           : 0;
            pointer-events  : none;
            z-index         : 10;
            display         : none; /* controlled by SettingsManager.applyAll() */
            /* Horizontal scanlines: alternating transparent / semi-black rows */
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 1px,
                rgba(0, 0, 0, 0.08) 1px,
                rgba(0, 0, 0, 0.08) 2px
            ),
            /* Radial vignette — darkens the four corners */
            radial-gradient(
                ellipse at center,
                transparent 55%,
                rgba(0, 0, 0, 0.45) 100%
            );
        }

        /* Font preload helper - forces browser to load font */
        .font-preload {
            font-family: 'Press Start 2P', monospace;
            position: absolute;
            top: -9999px;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
  <script type="module" crossorigin src="/pcm/assets/index-Dv5Z-4aZ.js"></script>

<body>
    <!-- Font preload trick so font is ready before Phaser renders text -->
    <div class="font-preload" aria-hidden="true">.</div>
    <div id="game-container"></div>
    <div id="crt-overlay" aria-hidden="true"></div>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/pcm/sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
